[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "serp-rank-tracker"
version = "0.1.0"
description = "Track a domain's Google, Bing or DuckDuckGo positions for a list of keywords with the QuanticData SERP API, with SQLite history, AI Overview presence and CSV/JSON export."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
keywords = ["serp", "rank-tracker", "seo", "google-search", "keyword-tracking", "sqlite", "quanticdata"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]

[project.scripts]
serp-rank = "serp_rank_tracker.cli:main"

[project.urls]
Homepage = "https://github.com/quanticdata-io/serp-rank-tracker"
Documentation = "https://github.com/quanticdata-io/serp-rank-tracker#readme"
Issues = "https://github.com/quanticdata-io/serp-rank-tracker/issues"
Changelog = "https://github.com/quanticdata-io/serp-rank-tracker/blob/main/CHANGELOG.md"
"API reference" = "https://quanticdata.io/docs/"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5", "mypy>=1.13", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/serp_rank_tracker"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
allowed-confusables = ["›"]  # the separator search engines print in display links
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "C4", "RET"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
